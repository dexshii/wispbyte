# Netlify settings for wispbytestudio.com
# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

# Internal docs live in the repo but are not part of the website.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Security headers for every page and file.
# HTTPS + HSTS are handled by Netlify automatically for the custom domain.
[[headers]]
  for = "/*"
  [headers.values]
    # Only load scripts, styles, fonts, images, audio and video from this site.
    # The sha256 hash allows the one tiny inline script in index.html (opening-cover check);
    # update it if that script changes. YouTube is allowed only for an optional trailer embed.
    # Cloudflare Web Analytics: script from static.cloudflareinsights.com, reports to cloudflareinsights.com.
    # Trusted Types: page code may never inject raw HTML strings (blocks DOM-based XSS).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-oniadWie6W741k8VuKlf8jQbpjUUmBBxnm0JVp/qqoU=' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; worker-src 'none'; object-src 'none'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'"
    # Never allow the site to be framed by another site (clickjacking).
    X-Frame-Options = "DENY"
    # Browsers must respect the declared file types.
    X-Content-Type-Options = "nosniff"
    # Other sites only learn the domain, not the page, when a visitor follows a link.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Turn off browser features the site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), display-capture=(), browsing-topics=()"
    # Isolate the site from windows opened by other sites, and stop other sites embedding our files.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Fonts and images rarely change: cache for a week
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
